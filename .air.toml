root = "."
tmp_dir = "tmp/air"

[build]
  cmd = "go build -o ./tmp/air/shinyhub ./cmd/shinyhub"
  entrypoint = ["./tmp/air/shinyhub", "serve"]
  include_ext = ["go"]
  # Only production Go sources can change the server binary. Restricting the
  # walk avoids traversing node_modules, research output, examples, and docs.
  include_dir = ["cmd", "internal"]
  exclude_dir = [
    "bin",
    "tmp",
    "data",
    "docs",
    ".worktrees",
    ".git",
    ".github",
    ".superpowers",
    "internal/ui/static",
  ]
  exclude_regex = ["_test\\.go$"]
  delay = 500
  # Keep the last healthy server running when an edit does not compile.
  stop_on_error = false
  send_interrupt = true
  kill_delay = "2s"

[log]
  time = true

[misc]
  clean_on_exit = true
