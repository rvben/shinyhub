version: 2
updates:
  # GitHub Actions used by the CI and release workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Python packaging (the wheel/sdist build tooling).
  - package-ecosystem: pip
    directory: "/packaging/python"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
