name: ci

on:
  pull_request:
  push:
    branches: [main]

# A pull request keeps one run, for its newest push, and cancels the run it
# superseded. A push to main keeps a run of its own, so the result for a
# commit is never lost to the next push.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-go

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # go vet over the tree and, with their build tags, over the gated tests
      # that the default suite never compiles.
      - name: Lint
        run: make lint

      # oxlint over every JavaScript and TypeScript file; warnings fail the
      # step so a finding cannot linger.
      - name: Lint (JavaScript)
        run: make lint-js

      - name: Skill lint
        run: make skill-lint

      # The scripts the proxy inlines into app pages are embedded as committed
      # minified siblings of their sources; a source edit without a regenerate
      # would ship the previous script.
      - name: Minified injected scripts match their sources
        run: make ui-minify-check

      - name: Test trace delivery alerts
        run: make test-tracing-alerts

      - name: Test (Go)
        run: make test-go

      # The dashboard SPA is plain JS tested with jsdom; an uncaught throw breaks
      # the whole dashboard, so these tests gate every push too.
      - name: Test (JS)
        run: make test-js

      - name: Test (Python bookmarks)
        run: make test-py-bookmarks

      - name: Fuzz bookmark restore invariants
        run: make fuzz-py-bookmarks

      - name: Test (Python agent tools)
        run: make test-py-agent

      - name: Vulnerability scan
        run: make vuln

      # The release build held to its size and package-init budgets, with the
      # AWS operations it links checked against the allowlist.
      - name: Artifact budgets
        run: make check-artifact

      # The curl | sh installer, against a local release with the real layout.
      - name: Installer
        run: make test-install-e2e

      - name: PyPI index wait
        run: make test-wait-pypi-e2e

  # The bookmark SDK supports Python 3.10, whose copy protocol differs from
  # newer interpreters. Exercise its private Shiny restore API at the minimum
  # supported Shiny version too; the main job checks the newest supported one.
  test-python-bookmarks-minimum:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@v7
      - name: Bookmark SDK on minimum supported Python and Shiny
        run: make test-py-bookmarks PYTHON_VERSION=3.10 BOOKMARKS_SHINY='shiny==1.8.0'
      - name: Fuzz bookmark restore on minimum supported Shiny
        run: make fuzz-py-bookmarks PYTHON_VERSION=3.10 BOOKMARKS_SHINY='shiny==1.8.0'
      - name: Install Chromium for bookmark restore tests
        run: make install-py-bookmarks-browser PYTHON_VERSION=3.10 BOOKMARKS_SHINY='shiny==1.8.0'
      - name: Bookmark restoration in Chromium on minimum supported Shiny
        run: make test-py-bookmarks-browser PYTHON_VERSION=3.10 BOOKMARKS_SHINY='shiny==1.8.0'

  # Keep the stable baseline, older compatibility and newest preview under the
  # same SDK and native-launch checks; no free-threaded interpreter is selected.
  test-python-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14", "3.15"]
    env:
      PYTHON_VERSION: ${{ matrix.python }}+gil
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
      - uses: ./.github/actions/setup-playwright
        with:
          node-version: "24"
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - uses: astral-sh/setup-uv@v7
      - name: Python SDKs
        run: make test-py-identity test-py-bookmarks test-py-agent
      - name: Python tracing, launcher and native app
        run: make test-py-runtime
      - name: Real agent session
        run: make test-browser-agent-shiny-e2e
      - name: Real native deployment and browser lifecycle
        run: make test-browser-lifecycle-e2e

  # The Worker decides what reaches the demo container, and a request that
  # reaches a sleeping container wakes it. deploy/cloudflare-demo only deploys
  # after a release, so without this the cost boundary would first be checked
  # once it was already live. Its own job because these tests are TypeScript run
  # through Node's type stripping, which needs a newer runtime than the jsdom
  # tests pin, and because the type check needs the Worker's own dependencies.
  # The Go tests that pin the Worker's wiring run in the test job above.
  test-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: deploy/cloudflare-demo/package-lock.json

      - name: Type-check the demo Worker
        run: make check-worker

      - name: Test (demo Worker)
        run: make test-worker

      - name: Test WebSocket forwarding in the Workers runtime
        run: make test-worker-runtime

      - name: Test application startup readiness and error alerts
        run: make test-worker-python

  # The race suite is split in two jobs of about equal length: internal/api is
  # a third of the suite's race time on its own and every other package fits
  # in the remainder, so the two halves finish together. Both build the same
  # race-instrumented tree, which the per-job cache restores between runs.
  # This job keeps the historical test-race name.
  test-race:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-go

      - name: Test (race detector, every package except internal/api)
        run: make test-race-non-api

  test-race-api:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-go

      - name: Test internal/api (race detector)
        run: make test-race-api

  # Full Go suite against a throwaway Postgres, so a Postgres-only regression
  # (missing column in the baseline, a wrong-dialect query) is caught in CI
  # rather than only when someone runs `make test-postgres` locally. ubuntu-latest
  # ships Docker, so no extra setup is needed.
  test-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-go

      # pg_dump / pg_restore are exercised by the Postgres backup round-trip
      # test (internal/backup). The client major version must be >= the server
      # (postgres:16 in postgres-test.sh); the distro default client meets that
      # and is forward-compatible with newer servers.
      - name: Install PostgreSQL client (pg_dump/pg_restore)
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Test (Postgres backend, Docker)
        run: make test-postgres

  # Remote-worker end-to-end: launches a control plane + a real `shinyhub worker`
  # over mTLS and deploys a Shiny app onto a remote_docker tier (real containers),
  # then exercises bundle-pull dedup, tunnel routing, control-plane restart
  # re-adoption, and worker-kill -> replica-lost -> routing-drop. Its own job
  # because it needs a Docker daemon and runs ~2-3 min (the worker-down heartbeat
  # timeout dominates). ubuntu-latest ships Docker, so no extra setup is needed.
  test-remote-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-go

      - name: Remote-worker E2E (Docker)
        run: make test-remote-e2e

  # Zero-downtime handoff end-to-end: builds the binary, sends SIGHUP, and asserts
  # the main + metrics listeners hand off to a successor process with no
  # connection-refused gap. Its own job because it builds and runs the real binary
  # (tableflip cannot re-exec under `go test`); no Docker needed.
  test-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-go

      - name: Zero-downtime handoff E2E
        run: make test-handoff

  test-browser-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-playwright
        with:
          root-dependencies: "true"
      - name: Verify shared shell across routes and display states
        run: make test-browser-shell-e2e

  test-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v7
      - uses: ./.github/actions/setup-playwright
        with:
          root-dependencies: "true"
      - name: Real-backend and responsive browser acceptance
        run: npm run test:acceptance
      - name: Backup, restore, and upgrade acceptance
        if: ${{ !cancelled() }}
        run: make test-recovery
      - name: Live upgrade with real Shiny sessions
        run: make test-live-upgrade
      - name: Retain acceptance diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: acceptance-diagnostics
          path: |
            loadtest/results/acceptance-*/
            loadtest/results/browser-live-upgrade-*/
          if-no-files-found: ignore
          retention-days: 7

  test-browser-agent-charts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-playwright
        with:
          browser: ${{ matrix.browser }}
          root-dependencies: "true"
      - name: Verify charts, accessibility, host isolation and recovery
        env:
          SHINYHUB_E2E_BROWSER: ${{ matrix.browser }}
          SHINYHUB_E2E_BROWSER_CHANNEL: chromium
        run: make test-browser-agent-charts-e2e

  # Release-real developer onboarding: builds and uv-tool-installs the wheel,
  # starts the embedded binary, drives the hosted Chrome already present on the
  # runner through sign-in + CLI pairing, deploys, revokes, and reconnects.
  # This guards packaging and browser session restoration in one user journey.
  # The short browser checks (lifecycle, logs, app switcher, agent chat) share
  # the job; the two long lifecycle variants have jobs of their own below so
  # that they overlap with this one instead of following it.
  test-browser-onboarding-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-go

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v7

      - uses: ./.github/actions/setup-playwright
        with:
          root-dependencies: "true"

      - name: Real Shiny browser lifecycle E2E
        run: make test-browser-lifecycle-e2e

      - name: App-detail logs browser E2E
        run: make test-browser-logs-e2e

      - name: App switcher browser E2E
        run: make test-browser-app-nav-e2e

      - name: Agent chat Markdown browser E2E
        run: make test-browser-agent-chat-e2e

      - name: Browser onboarding E2E (installed wheel)
        run: make test-browser-onboarding-e2e

  # The lifecycle harness run with the session-relay flag: repeated reloads,
  # relay admission and refusal, revocation and bookmark continuity.
  test-browser-session-relays-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-go

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v7

      - uses: ./.github/actions/setup-playwright

      - name: Repeated reload and bookmark continuity E2E
        run: make test-browser-session-relays-e2e

  # The lifecycle harness run with the reload-producer flag: a real cron
  # producer overlapping a scheduled roll and an acknowledged reload.
  test-browser-reload-producers-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-go

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v7

      - uses: ./.github/actions/setup-playwright

      - name: Scheduled producer and reload handoff E2E
        run: make test-browser-reload-producers-e2e

  # Long-lived remote CLI contract. The previous release is a checksum-pinned
  # shipped binary, not a rebuild of an old tag: current connect/doctor/deploy/
  # recovery run against that server, then its CLI logs in to and deploys on the
  # current server. Protocol rejection is also asserted before authentication.
  test-cli-compatibility-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-go

      - uses: astral-sh/setup-uv@v7

      - name: Previous/current CLI-server compatibility E2E
        run: make test-cli-compatibility-e2e

  # Generated completion is only useful if the real shells can load and invoke
  # it. Exercise idempotent install + byte-exact uninstall under every supported
  # shell rather than limiting coverage to generated-script snapshots.
  test-shell-completion-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-go

      - name: Install bash, zsh, and fish
        run: sudo apt-get update && sudo apt-get install -y bash zsh fish

      - name: Verify PowerShell is available on the runner
        run: command -v pwsh

      - name: Shell completion lifecycle E2E
        run: make test-shell-completion-e2e

  # Kill-the-active HA failover: two real shinyhub processes against one Postgres;
  # SIGKILL the active and assert the standby keeps serving the same live replica
  # and then acquires the control-plane lease. Its own job because it needs a
  # Docker daemon (throwaway Postgres) and builds + runs the real binary.
  # ubuntu-latest ships Docker, so no extra setup is needed.
  test-ha:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-go

      - name: Kill-the-active HA failover (Docker + Postgres)
        run: make test-ha

  # Skill smoke: deploys the deploy-shinyhub skill's example app onto a real
  # server (native runtime) and asserts the proxy serves it (HTTP 200). Guards
  # the skill against drift in CLI flags, env vars, or the deploy flow. Its own
  # job because the example app installs `shiny` via uv on first start (needs uv
  # + network); the make target skips when uv is absent so local runs stay green.
  skill-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-go

      - uses: astral-sh/setup-uv@v7

      - name: Skill smoke (deploy example app)
        run: make skill-smoke

  # Build-provisioning gate: a real `uv sync` through the production
  # Landlock-sandboxed build path, on the corp shape that broke native deploys
  # twice (managed-Python provisioning + private-index env passthrough; the
  # class was invisible on dev boxes with a matching system Python and
  # PyPI-only deps). Needs network: uv downloads a managed CPython once.
  test-provisioning:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-go

      - uses: astral-sh/setup-uv@v7

      - name: Build-provisioning gate (sandboxed uv sync)
        run: make test-provisioning

  # Client-side identity-helper tests (Python + R JWT verification against a
  # token minted by the real production MintToken). Security-relevant surface,
  # so BOTH toolchains are provisioned and SHINYHUB_IDENTITY_STRICT=1 makes a
  # missing one fail the job: the R half of the contract is exactly where the
  # cross-language divergences live, and a skipped subtest is indistinguishable
  # from a passing one in a CI summary.
  test-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-go

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          freethreaded: false

      - uses: astral-sh/setup-uv@v7

      - uses: r-lib/actions/setup-r@v2
        id: setup-r
        with:
          r-version: release
          use-public-rspm: true

      # The helper packages come from the binary mirror, but a fresh library
      # still downloads and unpacks about forty of them. Keep the user library
      # between runs, keyed on the R version and the files that name the
      # packages. bootstrap-r-identity installs only what is missing and loads
      # every package afterwards, so a restored library is verified rather than
      # trusted, and a package added to the list lands on top of the previous
      # library (restore-keys) and is saved under the new key.
      - name: Cache R packages
        uses: actions/cache@v6
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-lib-${{ runner.os }}-${{ steps.setup-r.outputs.installed-r-version }}-${{ hashFiles('packaging/r-identity/DESCRIPTION', 'Makefile') }}
          restore-keys: |
            r-lib-${{ runner.os }}-${{ steps.setup-r.outputs.installed-r-version }}-

      # sodium binds libsodium; jose binds openssl (already on the runner).
      # libuv is for fs, a testthat dependency: use-public-rspm above serves
      # prebuilt binaries so nothing should compile, but a package with no
      # binary for the runner's distro falls back to source without saying so.
      - name: Install R helper dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsodium-dev libuv1-dev
          make bootstrap-r-identity

      - name: Identity helper tests
        env:
          SHINYHUB_IDENTITY_STRICT: "1"
        run: make test-identity

      # R CMD check validates what testthat cannot: docs matching the functions
      # they document, NAMESPACE consistency, and runnable examples.
      - name: R package check
        run: make check-r-identity

  # Terraform fmt/validate for the AWS ECS IaC. No cloud credentials are needed
  # (init runs with -backend=false), so a syntax/format regression is caught in
  # CI rather than only when someone runs `make iac-validate` locally.
  iac-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4

      - name: Terraform fmt/init/validate
        run: make iac-validate

  # Build the image a release ships (release-built binary in
  # Dockerfile.goreleaser) and scan it for HIGH/CRITICAL CVEs (base layers +
  # the Go binary's stdlib and deps) with Trivy. Complements `make vuln` (Go
  # source). docker is preinstalled on ubuntu-latest, so `make scan-image` runs
  # the scan via the pinned Trivy container without a separate install step.
  scan-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-go

      - name: Build and scan the container image
        run: make scan-image

  # The one check for branch rules to require. It fails when any job it needs
  # did not succeed (failed, was cancelled or was skipped), so a job renamed
  # above cannot drop out of the rules unnoticed. A job added above must be
  # added to this list.
  ci-ok:
    runs-on: ubuntu-latest
    if: always()
    needs:
      - test
      - test-python-bookmarks-minimum
      - test-python-runtime
      - test-worker
      - test-race
      - test-race-api
      - test-postgres
      - test-remote-e2e
      - test-handoff
      - test-browser-shell
      - test-acceptance
      - test-browser-agent-charts
      - test-browser-onboarding-e2e
      - test-browser-session-relays-e2e
      - test-browser-reload-producers-e2e
      - test-cli-compatibility-e2e
      - test-shell-completion-e2e
      - test-ha
      - skill-smoke
      - test-provisioning
      - test-identity
      - iac-validate
      - scan-image
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.value.result)\t\(.key)"' <<< "$RESULTS"
          jq -e 'all(.[]; .result == "success")' <<< "$RESULTS" > /dev/null
