name: Demo deployment

on:
  workflow_run:
    workflows: ["release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: public-demo
  cancel-in-progress: false

jobs:
  silence:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment:
      name: public-demo-observability
      deployment: false
    outputs:
      id: ${{ steps.rollout-silence.outputs.silence_id }}
      expiry: ${{ steps.rollout-silence.outputs.silence_expiry }}
      attempt: ${{ steps.rollout-silence.outputs.workflow_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: scripts/demo-alert-silence.mjs
          sparse-checkout-cone-mode: false

      - name: Silence demo Worker error notifications for the rollout
        id: rollout-silence
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_DEMO_WORKER_ERRORS_POLICY_ID: ${{ vars.CLOUDFLARE_DEMO_WORKER_ERRORS_POLICY_ID }}
          CLOUDFLARE_NOTIFICATIONS_API_TOKEN: ${{ secrets.CLOUDFLARE_NOTIFICATIONS_API_TOKEN }}
        run: node ./scripts/demo-alert-silence.mjs start

  deploy:
    needs: silence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      verified-at: ${{ steps.verified.outputs.timestamp }}
    environment:
      name: public-demo
      url: https://demo.shinyhub.dev
    steps:
      - name: Verify the silence will cover the deployment and cooldown
        env:
          SILENCE_EXPIRY: ${{ needs.silence.outputs.expiry }}
          SILENCE_ATTEMPT: ${{ needs.silence.outputs.attempt }}
        run: |
          # Reserve the full 30-minute job timeout plus the 11-minute cooldown.
          if [[ "$SILENCE_ATTEMPT" != "$GITHUB_RUN_ATTEMPT" || ! "$SILENCE_EXPIRY" =~ ^[0-9]{10}$ ]]; then
            echo "::error::No valid deployment silence expiry. Rerun the entire workflow."
            exit 1
          fi
          remaining=$((SILENCE_EXPIRY - $(date -u +%s)))
          if (( remaining < 41 * 60 )); then
            echo "::error::The demo runner started too late for its alert silence. Rerun the entire workflow."
            exit 1
          fi

      - name: Resolve deployment ref
        id: deployment-ref
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const requestedRef = context.eventName === "workflow_run"
              ? context.payload.workflow_run?.head_sha
              : context.payload.inputs?.ref;
            if (!requestedRef) {
              core.setFailed("No deployment ref was provided.");
              return;
            }

            try {
              const { data: commit } = await github.rest.repos.getCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: requestedRef,
              });
              if (!/^[0-9a-f]{40}$/.test(commit.sha)) {
                throw new Error("GitHub returned an invalid commit SHA");
              }
              core.info(`Resolved deployment ref ${requestedRef} to ${commit.sha}.`);
              core.setOutput("sha", commit.sha);
            } catch (error) {
              core.setFailed(`Unable to resolve deployment ref ${requestedRef}: ${error.message}`);
            }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.deployment-ref.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: deploy/cloudflare-demo/package-lock.json

      - name: Install and validate the demo Worker
        working-directory: deploy/cloudflare-demo
        run: |
          npm ci
          npm run check

      - name: Test the demo configuration
        run: go test ./deploy/cloudflare-demo

      - name: Test application startup readiness and error alerts
        working-directory: deploy/cloudflare-demo
        run: python3 -m unittest test_startup_readiness.py test_worker_errors_alert.py

      - name: Test the demo Worker
        run: make test-worker

      - name: Test WebSocket forwarding in the Workers runtime
        working-directory: deploy/cloudflare-demo
        env:
          WRANGLER_SEND_METRICS: "false"
        run: npm run test:runtime

      - uses: ./.github/actions/setup-playwright
        with:
          node-version: "24"

      - name: Verify Cloudflare deployment credentials
        working-directory: deploy/cloudflare-demo
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is not configured in the public-demo environment" >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is not configured in the public-demo environment" >&2; exit 1; }
          [[ ! "$CLOUDFLARE_API_TOKEN" =~ [[:space:]] ]] || { echo "CLOUDFLARE_API_TOKEN must contain only the bare token value, not Cloudflare's verification command" >&2; exit 1; }
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-f]{32}$ ]] || { echo "CLOUDFLARE_ACCOUNT_ID must be a 32-character lowercase hexadecimal account ID" >&2; exit 1; }
          npx wrangler whoami --account "$CLOUDFLARE_ACCOUNT_ID"

      - name: Deploy the demo Worker and container
        id: deploy-demo
        working-directory: deploy/cloudflare-demo
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          deployment_id=$(node -p "require('node:crypto').randomUUID()")
          printf 'header /api/server-info X-ShinyHub-Demo-Image "%s"\n' "$deployment_id" > deployment.caddy
          npm run deploy -- --var "DEMO_DEPLOYMENT_ID:$deployment_id"
          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"

      - name: Smoke-test the deployed release and server-side transports
        id: transport-smoke
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SHINYHUB_DEMO_EXPECTED_DEPLOYMENT: ${{ steps.deploy-demo.outputs.deployment_id }}
        run: |
          test -n "$SHINYHUB_DEMO_EXPECTED_DEPLOYMENT"
          expected_version=$(node -p "require('./package.json').version")
          SHINYHUB_DEMO_EXPECTED_VERSION="$expected_version" node ./scripts/demo-smoke-verified.mjs

      - name: Verify the demo opens in Chromium
        id: browser-smoke
        if: ${{ !cancelled() && steps.deploy-demo.outcome == 'success' }}
        run: node ./scripts/demo-browser-smoke.mjs

      - name: Record successful verification time
        id: verified
        if: ${{ success() && steps.transport-smoke.outcome == 'success' && steps.browser-smoke.outcome == 'success' }}
        run: echo "timestamp=$(date -u +%s)" >> "$GITHUB_OUTPUT"

  restore-alerting:
    needs: [silence, deploy]
    if: ${{ always() && needs.silence.outputs.id != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: public-demo-observability
      deployment: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: scripts/demo-alert-silence.mjs
          sparse-checkout-cone-mode: false

      - name: Finalize the rollout silence
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_DEMO_WORKER_ERRORS_POLICY_ID: ${{ vars.CLOUDFLARE_DEMO_WORKER_ERRORS_POLICY_ID }}
          CLOUDFLARE_NOTIFICATIONS_API_TOKEN: ${{ secrets.CLOUDFLARE_NOTIFICATIONS_API_TOKEN }}
          SHINYHUB_DEMO_SILENCE_ID: ${{ needs.silence.outputs.id }}
          DEMO_VERIFIED: ${{ needs.deploy.result == 'success' && needs.deploy.outputs.verified-at != '' }}
          SHINYHUB_DEMO_VERIFIED_AT: ${{ needs.deploy.outputs.verified-at }}
        run: |
          if [[ "$DEMO_VERIFIED" == 'true' ]]; then
            node ./scripts/demo-alert-silence.mjs success
          else
            node ./scripts/demo-alert-silence.mjs failure
          fi
