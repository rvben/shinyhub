name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "zensical.toml"
      - "scripts/docs-descriptions.py"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "zensical.toml"
      - "scripts/docs-descriptions.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Zensical
        run: python -m pip install zensical==0.0.31

      - name: Refuse tracked internal material
        run: |
          private_files="$(git ls-files -- docs/superpowers docs/reports 'docs/**/*.html')"
          if [[ -n "$private_files" ]]; then
            echo "Internal planning/report files must not be tracked:" >&2
            echo "$private_files" >&2
            exit 1
          fi

      - name: Build documentation
        run: zensical build --clean

      - name: Verify public documentation payload
        run: |
          test -f site/index.html
          test -f site/getting-started/installation/index.html
          test -f site/demo/index.html
          test -f site/images/favicon.png
          test -f site/search.json
          test -f site/stylesheets/extra.css
          test ! -e site/superpowers
          test ! -e site/reports
          unexpected_html="$(find site -mindepth 1 -maxdepth 1 -type f -name '*.html' ! -name index.html ! -name 404.html -print)"
          if [[ -n "$unexpected_html" ]]; then
            echo "Unexpected standalone HTML in the public documentation payload:" >&2
            echo "$unexpected_html" >&2
            exit 1
          fi

      # Asserted against the built HTML, not the frontmatter: an unquoted colon
      # in a description makes Zensical drop the key and serve the site-wide
      # text instead, which leaves the source looking correct.
      - name: Check per-page descriptions
        run: python scripts/docs-descriptions.py site

      - uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: site/

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: documentation-production
      cancel-in-progress: true
    # Keep documentation credentials and deployment history isolated from the
    # separately operated public demo.
    environment:
      name: documentation
      url: https://shinyhub.dev
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: docs-site
          path: site/

      - name: Verify Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is not configured in the documentation environment" >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is not configured in the documentation environment" >&2; exit 1; }
          [[ ! "$CLOUDFLARE_API_TOKEN" =~ [[:space:]] ]] || { echo "CLOUDFLARE_API_TOKEN must contain only the bare token value" >&2; exit 1; }
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-f]{32}$ ]] || { echo "CLOUDFLARE_ACCOUNT_ID must be a 32-character lowercase hexadecimal account ID" >&2; exit 1; }

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.126.0"
          command: pages deploy site --project-name=shinyhub-dev
