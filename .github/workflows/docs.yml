name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "zensical.toml"
      - "scripts/docs-smoke.py"
      - "scripts/docs-descriptions.py"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "zensical.toml"
      - "scripts/docs-smoke.py"
      - "scripts/docs-descriptions.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Zensical
        run: python -m pip install zensical==0.0.31

      - name: Build documentation
        run: zensical build --clean

      - name: Smoke-test built site
        run: python scripts/docs-smoke.py site

      # Asserted against the built HTML, not the frontmatter: an unquoted colon
      # in a description makes Zensical drop the key and serve the site-wide
      # text instead, which leaves the source looking correct.
      - name: Check per-page descriptions
        run: python scripts/docs-descriptions.py site

      - uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: site/

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: docs-site
          path: site/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=shinyhub-dev
