name: Dependency health

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: read
  pull-requests: read

jobs:
  update:
    uses: rvben/upd/.github/workflows/dependency-health.yml@ecb605d32c4edc8dee4091aeb30b3d37ebdd290a # v0.10.0
    with:
      langs: go,node,python,actions
      lock: true
      min-age: 7d
      max-bump: minor
      prepare-command: python3 -m pip install uv
      validation-command: >-
        npm ci &&
        go vet ./... &&
        go vet -tags "integration e2e" ./... &&
        make test-go &&
        make test-js &&
        make vuln &&
        go build -o /tmp/shinyhub ./cmd/shinyhub
      fail-on-blocked: false
      branch: deps/upd
      commit-message: "chore(deps): weekly dependency update"
