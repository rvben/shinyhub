name: Dependency health

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: read
  pull-requests: read

jobs:
  update:
    uses: rvben/upd/.github/workflows/dependency-health.yml@b183939ff7dc62539afb00b3c555ffbfe3c5d58b # v0.18.2
    with:
      langs: go,node,python,actions
      lock: true
      min-age: 7d
      max-bump: minor
      # The tracing tests require 3.14+gil. Install the regular build explicitly:
      # uv can discover it with +gil but cannot download that variant request.
      prepare-command: >-
        python3 -m pip install uv &&
        uv python install 3.14
      # make test is test-go, test-js and test-worker, so a target added there is
      # validated here without editing this list. The demo Worker is a separate
      # npm package with its own dependencies, so it is installed and type-checked
      # on its own; otherwise a bump to its TypeScript or container library would
      # reach the release deploy unvalidated.
      validation-command: >-
        npm ci &&
        (cd deploy/cloudflare-demo && npm ci && npm run check) &&
        go vet ./... &&
        go vet -tags "integration e2e" ./... &&
        make test &&
        make vuln &&
        go build -o /tmp/shinyhub ./cmd/shinyhub
      fail-on-blocked: false
      branch: deps/upd
      commit-message: "chore(deps): weekly dependency update"
      auto-merge: true
      merge-method: squash
      allowed-paths: >-
        .github/actions/setup-go/action.yml
        .github/workflows/*.yaml
        .github/workflows/*.yml
        cmd/shinyhub/example_app/pyproject.toml
        deploy/cloudflare-demo/package-lock.json
        deploy/cloudflare-demo/package.json
        deploy/demo/apps/operations-dashboard/requirements.txt
        examples/agent-chat-demo/requirements.txt
        examples/agent-shiny-demo/requirements.txt
        examples/bookmarking-demo/requirements.txt
        examples/dash-demo/requirements.txt
        examples/fastapi-demo/requirements.txt
        examples/identity-demo/requirements.txt
        examples/streamlit-demo/requirements.txt
        go.mod
        go.sum
        loadtest/browser/app/requirements.txt
        loadtest/browser/bookmarks/requirements.txt
        loadtest/preload-memory/pyproject.toml
        loadtest/production-runtime/python/requirements.txt
        loadtest/python-runtime/pyproject.toml
        loadtest/render/app/requirements.txt
        loadtest/render/driver/package-lock.json
        loadtest/render/driver/package.json
        loadtest/update-capacity/app/requirements.txt
        package-lock.json
        package.json
        packaging/python-agent/pyproject.toml
        packaging/python-bookmarks/pyproject.toml
        packaging/python-identity/pyproject.toml
        packaging/python/pyproject.toml
        packaging/vscode/package.json
        skills/deploy-shinyhub/example-app/requirements.txt
