name: Dependency health

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: read
  pull-requests: read

jobs:
  update:
    uses: rvben/upd/.github/workflows/dependency-health.yml@c3215394f3c07a0252e9c759eb23c8b83072f7b2 # v0.16.0
    with:
      langs: go,node,python,actions
      lock: true
      min-age: 7d
      max-bump: minor
      # The tracing tests require 3.14+gil. Install the regular build explicitly:
      # uv can discover it with +gil but cannot download that variant request.
      prepare-command: >-
        python3 -m pip install uv &&
        uv python install 3.14
      # make test is test-go, test-js and test-worker, so a target added there is
      # validated here without editing this list. The demo Worker is a separate
      # npm package with its own dependencies, so it is installed and type-checked
      # on its own; otherwise a bump to its TypeScript or container library would
      # reach the release deploy unvalidated.
      validation-command: >-
        npm ci &&
        (cd deploy/cloudflare-demo && npm ci && npm run check) &&
        go vet ./... &&
        go vet -tags "integration e2e" ./... &&
        make test &&
        make vuln &&
        go build -o /tmp/shinyhub ./cmd/shinyhub
      fail-on-blocked: false
      branch: deps/upd
      commit-message: "chore(deps): weekly dependency update"
