name: publish shinyhub-agent

on:
  push:
    tags:
      - "shinyhub-agent-v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.6"
          python-version: "3.12"
          enable-cache: false
          working-directory: packaging/python-agent

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Verify tag matches package version
        working-directory: packaging/python-agent
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#shinyhub-agent-v}"
          package_version="$(uv run --isolated --no-project python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$tag_version" = "$package_version"

      - name: Build and validate distributions
        working-directory: packaging/python-agent
        run: |
          set -euo pipefail
          uv build --no-sources .
          uv run --isolated --no-project --with 'twine>=7' twine check dist/*

      - name: Verify wheel and source distribution
        working-directory: packaging/python-agent
        run: |
          set -euo pipefail
          for archive in dist/*.whl dist/*.tar.gz; do
            uv run --isolated --no-project --with "$archive" python -c 'import os; from importlib.resources import files; import shinyhub_agent as a; assert a.__version__ == os.environ["GITHUB_REF_NAME"].removeprefix("shinyhub-agent-v"); assert a.BedrockChat; assert files("shinyhub_agent").joinpath("www/chat.js").is_file(); assert files("shinyhub_agent").joinpath("www/bridge.js").is_file()'
          done
          uv run --isolated --no-project --with dist/*.whl --with boto3 --with pytest pytest tests/ -q
          node tests/bridge.test.cjs
          npm --prefix ../.. ci --ignore-scripts --no-audit --no-fund
          node --test tests/chat.test.cjs tests/bridge-approval.test.cjs

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shinyhub-agent-dist
          path: packaging/python-agent/dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/shinyhub-agent/
    permissions:
      id-token: write
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.6"
          enable-cache: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: shinyhub-agent-dist
          path: dist

      - name: Generate PEP 740 attestations
        uses: astral-sh/attest-action@f589a42a7efb6fe400b4f400de60b4bc90390027 # v0.0.6

      - name: Publish shinyhub-agent to PyPI
        run: uv publish --trusted-publishing always dist/*
