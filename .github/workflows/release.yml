name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# Every job starts read-only. The gate jobs run the test suites and whatever
# those pull in, so none of that code ever runs under a token that can write
# to the repository or publish. Only the release job is granted the publishing
# permissions, and it runs only once every gate has passed.
#
# Every action is pinned to a commit. Most of these steps run only at release
# time, so no CI run can catch an upstream tag that moved or broke before the
# tag is already pushed; the version comment is what the dependency updater
# reads and rewrites together with the commit.
permissions:
  contents: read

jobs:
  # The release is hermetic: it re-runs the gates against the exact tagged
  # tree rather than trusting the ci workflow's check-run on a racing commit.
  # Same make targets the ci workflow runs, spread over jobs that run at the
  # same time instead of one after another.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-go

      # The Worker tests under make check run TypeScript through Node's type
      # stripping, which needs a newer runtime than the dashboard tests.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p 'require("./package.json").version')"

      # The deterministic gate contributors run before a pull request:
      # formatting, vet, oxlint, skill metadata, the minified injected
      # scripts, and the Go, dashboard and Worker tests.
      - name: Standard gate
        run: make check

      # The release build held to its size and package-init budgets, with the
      # AWS operations it links checked against the allowlist.
      - name: Artifact budgets
        run: make check-artifact

      - name: Python helper tests
        run: make test-py-bookmarks test-py-agent

      - name: Vulnerability scan
        run: make vuln

  # Re-run the cross-release contract against the exact tagged tree before
  # publishing. The pin must advance deliberately when a new compatibility
  # baseline is chosen; its checked-in checksums prevent artifact drift.
  gate-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-go

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Previous/current CLI-server compatibility E2E
        run: make test-cli-compatibility-e2e

      - name: Install completion test shells
        run: sudo apt-get update && sudo apt-get install -y bash zsh fish

      - name: Verify PowerShell is available on the runner
        run: command -v pwsh

      - name: Shell completion lifecycle E2E
        run: make test-shell-completion-e2e

  # Build-provisioning gate: real sandboxed `uv sync` on the corp shape
  # (managed-Python provisioning + private-index env passthrough). The
  # #40/#41 class shipped in releases precisely because no release gate
  # exercised it; this one does, before any artifact is published.
  gate-provisioning:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-go

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Build-provisioning gate (sandboxed uv sync)
        run: make test-provisioning

  # Exercise the tagged application with real Shiny and a fresh browser
  # before any release artifact is published. The interpreter must match
  # the Makefile's PYTHON_VERSION baseline: the gate forbids uv downloads,
  # so it can only find a Python that this step provisions. The two long
  # lifecycle variants have jobs of their own below.
  gate-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-go

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - uses: ./.github/actions/setup-playwright
        with:
          root-dependencies: "true"

      - name: Real Shiny browser lifecycle release gate
        run: make test-browser-lifecycle-e2e

      - name: Shared sidebar consistency release gate
        run: make test-browser-shell-e2e

  gate-browser-session-relays:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-go

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - uses: ./.github/actions/setup-playwright

      - name: Repeated reload and bookmark continuity release gate
        run: make test-browser-session-relays-e2e

  gate-browser-reload-producers:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-go

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - uses: ./.github/actions/setup-playwright

      - name: Scheduled producer and reload handoff release gate
        run: make test-browser-reload-producers-e2e

  # Builds, signs and publishes. Nothing here runs a test; the gates above did.
  release:
    needs:
      - gate
      - gate-cli
      - gate-provisioning
      - gate-browser
      - gate-browser-session-relays
      - gate-browser-reload-producers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write       # the GitHub release and its assets
      packages: write       # the image on GHCR
      id-token: write       # cosign keyless signing + SLSA provenance OIDC
      attestations: write   # SLSA build-provenance attestations for binaries + image
    outputs:
      notes-drift: ${{ steps.verify-notes.outputs.drift }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Log in to GHCR
        uses: docker/login-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # syft generates the SPDX SBOMs configured in .goreleaser.yaml (sboms:).
      - name: Install syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0

      # The release body is CHANGELOG.md's section for this tag, not a generated
      # commit list. Fails the release if the tag has no section, rather than
      # publishing empty notes.
      - name: Extract release notes from CHANGELOG.md
        run: make release-notes VERSION="${GITHUB_REF_NAME#v}"

      # GoReleaser is pinned to an exact version: it runs only here, so a new
      # minor that changes how a flag or the config is read would first show
      # up in a published release. Bump it deliberately and read its release
      # notes against .goreleaser.yaml.
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.19.0
          args: release --clean --release-notes=tmp/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The release-notes hand-off only runs at tag time, so no CI run before a
      # release can prove GoReleaser honored it. This checks it from the other
      # side: read back the body GitHub actually published and compare it to the
      # text we handed over. On a mismatch it rewrites the body from CHANGELOG.md
      # and records drift for the notes-drift job, which fails the run without
      # taking the publish jobs down with it. v0.11.3 is why: the flag was
      # silently ignored, this step failed, and PyPI never got the version, so
      # recovering cost a whole version number rather than a re-run.
      - name: Verify the published release body matches CHANGELOG.md
        id: verify-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # GitHub round-trips neither line endings nor trailing blank lines
          # reliably, so normalize both before comparing.
          norm() {
            sed 's/\r$//' "$1" | awk 'NF {last = NR} {line[NR] = $0} END {for (i = 1; i <= last; i++) print line[i]}'
          }
          published() {
            gh release view "$GITHUB_REF_NAME" --json body -q .body > tmp/published-body.md
            norm tmp/published-body.md > tmp/notes-published.md
          }
          norm tmp/release-notes.md > tmp/notes-sent.md
          published
          if cmp -s tmp/notes-sent.md tmp/notes-published.md; then
            echo "Release body matches CHANGELOG.md ($(wc -l < tmp/notes-sent.md | tr -d ' ') lines)"
            exit 0
          fi
          echo "::warning::Published release body is not the CHANGELOG.md section handed to GoReleaser; rewriting it"
          diff -u tmp/notes-sent.md tmp/notes-published.md || true
          echo "drift=true" >> "$GITHUB_OUTPUT"
          gh release edit "$GITHUB_REF_NAME" --notes-file tmp/release-notes.md
          published
          if ! cmp -s tmp/notes-sent.md tmp/notes-published.md; then
            echo "::error::Rewriting the release body from CHANGELOG.md did not take"
            diff -u tmp/notes-sent.md tmp/notes-published.md || true
            exit 1
          fi
          echo "Release body corrected from CHANGELOG.md"

      # SLSA build provenance. These run after publish: the artifacts are already
      # released, so an attestation hiccup is re-runnable and never blocks the
      # release itself. GoReleaser strips the leading v, so the image tag is the
      # bare version.
      - name: Resolve published image digest
        id: image
        run: |
          ref="ghcr.io/rvben/shinyhub:${GITHUB_REF_NAME#v}"
          digest=$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest release binaries (SLSA provenance)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/shinyhub_*.tar.gz
            dist/checksums.txt

      - name: Attest container image (SLSA provenance)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/rvben/shinyhub
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

  # Turns a corrected release body into a red run. Nothing depends on this job,
  # so the failure is visible without stranding the PyPI and image publishing
  # that the release job feeds.
  notes-drift:
    needs: release
    if: needs.release.outputs.notes-drift == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Report the release body drift
        run: |
          echo "::error::GoReleaser did not publish the CHANGELOG.md section; the release job rewrote it. Fix the release-notes hand-off before the next tag."
          exit 1

  wheels:
    needs: release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,  goarch: amd64, wheel-platform: manylinux_2_17_x86_64 }
          - { goos: linux,  goarch: arm64, wheel-platform: manylinux_2_17_aarch64 }
          - { goos: darwin, goarch: amd64, wheel-platform: macosx_11_0_x86_64 }
          - { goos: darwin, goarch: arm64, wheel-platform: macosx_11_0_arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # The wheel republishes the binary on PyPI, so it must be the one the
      # release job signed for this tag, not whatever the release holds now.
      - name: Download and verify binary from GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          TARBALL="shinyhub_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz"
          mkdir -p /tmp/dl
          gh release download "$TAG" -p "$TARBALL" -p checksums.txt -p checksums.txt.bundle -D /tmp/dl
          make verify-release-asset DIR=/tmp/dl ASSET="$TARBALL" TAG="$TAG"
          tar -xzf "/tmp/dl/$TARBALL" -C /tmp/dl
          install -m 755 /tmp/dl/shinyhub packaging/python/src/shinyhub/_binary/shinyhub

      - name: Build wheel
        env:
          SHINYHUB_WHEEL_PLATFORM: ${{ matrix.wheel-platform }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip build hatchling
          export SHINYHUB_WHEEL_VERSION="${GITHUB_REF_NAME#v}"
          python -m build --wheel packaging/python/

      - name: Smoke-test wheel on native runner
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          set -euo pipefail
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install packaging/python/dist/*.whl
          OUT="$(/tmp/venv/bin/shinyhub --version)"
          echo "Binary reported: $OUT"
          EXPECTED="${GITHUB_REF_NAME#v}"
          echo "$OUT" | grep -q "$EXPECTED" \
            || { echo "shinyhub --version output '$OUT' does not contain '$EXPECTED'"; exit 1; }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.goos }}-${{ matrix.goarch }}
          path: packaging/python/dist/*.whl
          if-no-files-found: error
          retention-days: 7

  sdist:
    # Source distribution is a stub: no binary, so any wheel built from
    # it on an unsupported platform fails with a clear error message
    # (see packaging/python/hatch_build.py::PlatformTagHook).
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Build sdist
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip build hatchling
          export SHINYHUB_WHEEL_VERSION="${GITHUB_REF_NAME#v}"
          python -m build --sdist packaging/python/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: packaging/python/dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/shinyhub/
    permissions:
      id-token: write   # required for PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: List downloaded artifacts
        run: ls -la dist/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist

  # Publish the app-facing SDK, shinyhub-identity: the pure-Python helper a Shiny/
  # Streamlit/Dash app imports to read its forwarded identity (docs/identity.md).
  # It is deliberately a SEPARATE package from `shinyhub` - the main wheel bundles
  # the Go server binary, which an app must never drag into its runtime, and the
  # helper is versioned independently in packaging/python-identity/pyproject.toml.
  # skip-existing makes this idempotent: it publishes only when that version bumps;
  # a re-run on an already-published version is a no-op, so it can ride every tag.
  identity-helper:
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/shinyhub-identity/
    permissions:
      id-token: write   # PyPI trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Build shinyhub-identity
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip build
          python -m build packaging/python-identity/

      - name: Verify the built wheel installs and passes its tests
        run: |
          set -euo pipefail
          python -m venv /tmp/id-venv
          /tmp/id-venv/bin/pip install --upgrade pip pytest
          /tmp/id-venv/bin/pip install packaging/python-identity/dist/*.whl
          /tmp/id-venv/bin/python -c "from shinyhub_identity import current_user; print('import ok')"
          /tmp/id-venv/bin/pytest packaging/python-identity/tests/ -q

      - name: Publish to PyPI (skip if version already exists)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: packaging/python-identity/dist
          skip-existing: true
