name: Trusted publishing live

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: trusted-publishing-live
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Build CLI
        run: go build -o "$RUNNER_TEMP/shinyhub" ./cmd/shinyhub
      - name: Verify publishing, replay, scope, revocation, and expiry
        env:
          SHINYHUB_TEST_CLI: ${{ runner.temp }}/shinyhub
        run: python3 scripts/trusted-publishing-live.py
