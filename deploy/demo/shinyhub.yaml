database:
  driver: sqlite
  dsn: /data/db/shinyhub.db

server:
  host: 127.0.0.1
  port: 8080
  base_url: https://demo.shinyhub.dev
  app_origin: https://apps.demo.shinyhub.dev
  trusted_proxies:
    - 127.0.0.0/8
    - ::1/128
  shutdown_apps: adopt

auth:
  secret: replaced-by-SHINYHUB_AUTH_SECRET
  local_login: false
  oauth_default_role: viewer
  operator_audit_access: false

storage:
  version_retention: 2
  app_quota_mb: 512
  max_bundle_mb: 64

runtime:
  mode: docker
  default_replicas: 1
  max_replicas: 1
  default_max_sessions_per_replica: 6
  default_worker_isolation: multiplex
  docker:
    socket: /var/run/docker.sock
    network_mode: host
    images:
      python: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
      r: rocker/shiny:4.5.1
    default_memory_mb: 512
    default_cpu_percent: 100

lifecycle:
  watch_interval: 15s
  restart_max_attempts: 3
  hibernate_timeout: 10m

defaults:
  app_visibility: private
  timezone: Europe/Amsterdam

maintenance:
  audit_retention_days: 30
  schedule_run_retention_count: 20
  app_log_run_retention_count: 10
  interval: 1h

branding:
  site_title: ShinyHub Demo
  theme:
    primary_color: "#13b8a6"
  footer_links:
    - label: Documentation
      url: https://shinyhub.dev
    - label: GitHub
      url: https://github.com/rvben/shinyhub
