[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shinyhub-agent"
version = "0.3.0"
description = "Session-scoped agent tools for Python Shiny apps on ShinyHub"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["shinyhub", "shiny", "agents", "webmcp", "ag-ui"]
classifiers = [
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = ["shiny>=1.8.0,<2", "jsonschema>=4.26,<5", "httpx>=0.28,<1"]

[project.urls]
Homepage = "https://github.com/rvben/shinyhub"
Repository = "https://github.com/rvben/shinyhub"
Issues = "https://github.com/rvben/shinyhub/issues"

[project.optional-dependencies]
bedrock = ["boto3>=1.43,<2"]
test = ["pytest>=9.1.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/shinyhub_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
